<!-- VDP seller -> auto center schema (server-rendered, crawlable without JS).

     PREFERRED: the VDPs Template already carries Car + Offer JSON-LD whose offers.seller is an AutoDealer (built in
     Webflow page settings, not in this repo). Add ONE property to that seller object, bound to the new CMS fields:

       "seller": {
         "@type": "AutoDealer",
         "name": "{{dealer-name}}",
         ...existing properties...,
         "containedInPlace": {
           "@type": "Place",
           "@id": "https://shopbestest.com/auto-centers/{{auto-center-slug}}#place",
           "name": "{{auto-center-name}}",
           "url": "https://shopbestest.com/auto-centers/{{auto-center-slug}}"
         }
       }

     The @id matches the Place node on the hub page (auto_center_pages.py), so the two pages share one entity.
     Webflow cannot make one JSON property conditional, so if the template's JSON-LD lives in page custom code, put the
     containedInPlace line in only when the field is set is not possible there; instead keep that block unchanged and
     use the FALLBACK below, an HTML Embed with conditional visibility "auto-center-slug is set".

     FALLBACK (standalone node; Google merges it with the Car seller by name + address): -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "AutoDealer",
  "name": "{{wf {&quot;path&quot;:&quot;dealer-name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{wf {&quot;path&quot;:&quot;dealer-street&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "addressLocality": "{{wf {&quot;path&quot;:&quot;dealer-city&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "postalCode": "{{wf {&quot;path&quot;:&quot;dealer-zip&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "addressRegion": "CA",
    "addressCountry": "US"
  },
  "containedInPlace": {
    "@type": "Place",
    "@id": "https://shopbestest.com/auto-centers/{{wf {&quot;path&quot;:&quot;auto-center-slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#place",
    "name": "{{wf {&quot;path&quot;:&quot;auto-center-name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "url": "https://shopbestest.com/auto-centers/{{wf {&quot;path&quot;:&quot;auto-center-slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}"
  }
}
</script>
<!-- js/nearby-row.js also patches containedInPlace into the existing Car JSON-LD at runtime (for rendered crawls);
     the embed above is what AI crawlers and non-rendering fetchers see. -->
